<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#292929" media="(prefers-color-scheme: dark)" />
    <title>Tienda</title>
    <style>
      /* Esqueleto de arranque: se abre con datos móviles, así que la pantalla
         no puede quedarse en blanco mientras baja el JavaScript. React lo
         reemplaza al montar. */
      :root { --f:#fafafa; --s:#ffffff; --h:#e8e8e8; }
      @media (prefers-color-scheme: dark) { :root { --f:#282828; --s:#353535; --h:#404040; } }
      html, body { margin:0; background:var(--f); }
      /* Mismo respeto por la barra de estado que la cabecera de React: este
         esqueleto es lo PRIMERO que se ve, y si arranca bajo el notch la app
         parece rota antes siquiera de cargar. */
      .vz-boot { padding:16px; padding-top:calc(env(safe-area-inset-top) + 16px); }
      .vz-h { background:var(--h); border-radius:10px; animation:vz 1.5s ease-in-out infinite; }
      .vz-hero { height:132px; border-radius:14px; margin-bottom:16px; }
      .vz-chips { display:flex; gap:8px; margin-bottom:18px; }
      .vz-chips .vz-h { height:34px; width:88px; border-radius:999px; }
      .vz-row { display:flex; gap:12px; margin-bottom:14px; }
      .vz-row .vz-h:first-child { width:84px; height:84px; flex:none; }
      .vz-row .vz-h:last-child { flex:1; height:84px; }
      @keyframes vz { 0%,100%{opacity:1} 50%{opacity:.45} }
    </style>
  </head>
  <body>
    <div id="root"><div class="vz-boot">
      <div class="vz-h vz-hero"></div>
      <div class="vz-chips"><div class="vz-h"></div><div class="vz-h"></div><div class="vz-h"></div></div>
      <div class="vz-row"><div class="vz-h"></div><div class="vz-h"></div></div>
      <div class="vz-row"><div class="vz-h"></div><div class="vz-h"></div></div>
      <div class="vz-row"><div class="vz-h"></div><div class="vz-h"></div></div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
